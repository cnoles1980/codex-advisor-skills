<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Site UX Audit Codex skill preview</title>
  <desc id="desc">A dark editor-style preview of the site-ux-audit SKILL.md showing its mission, read-only safety boundaries, and evidence-backed report format.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d5c"/>
      <stop offset="1" stop-color="#f46f5d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="230" fill="#ff875e" opacity="0.08"/>
  <circle cx="120" cy="930" r="280" fill="#6d7cff" opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="90" y="70" width="1420" height="860" rx="20" fill="#111319" stroke="#343846" stroke-width="2"/>
    <rect x="90" y="70" width="1420" height="66" rx="20" fill="#1d2029"/>
    <rect x="90" y="116" width="1420" height="20" fill="#1d2029"/>
    <circle cx="126" cy="103" r="9" fill="#ff6b6b"/>
    <circle cx="155" cy="103" r="9" fill="#ffc45c"/>
    <circle cx="184" cy="103" r="9" fill="#55d88b"/>
    <text x="800" y="110" text-anchor="middle" fill="#c7cad4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">site-ux-audit / SKILL.md</text>

    <rect x="90" y="136" width="300" height="794" fill="#171a22"/>
    <text x="126" y="184" fill="#858b9b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SKILL FILES</text>
    <rect x="112" y="212" width="256" height="52" rx="10" fill="#2b2530"/>
    <rect x="112" y="212" width="5" height="52" rx="2" fill="url(#accent)"/>
    <text x="138" y="245" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">SKILL.md</text>
    <text x="126" y="310" fill="#8b91a3" font-family="Arial, Helvetica, sans-serif" font-size="17">agents/</text>
    <text x="154" y="344" fill="#b5bac8" font-family="Arial, Helvetica, sans-serif" font-size="16">openai.yaml</text>
    <text x="126" y="406" fill="#8b91a3" font-family="Arial, Helvetica, sans-serif" font-size="17">references/</text>
    <text x="154" y="440" fill="#b5bac8" font-family="Arial, Helvetica, sans-serif" font-size="16">audit-report-template.md</text>
    <text x="154" y="474" fill="#b5bac8" font-family="Arial, Helvetica, sans-serif" font-size="16">heuristics.md</text>
    <rect x="126" y="830" width="226" height="1" fill="#343846"/>
    <text x="126" y="865" fill="#8b91a3" font-family="Arial, Helvetica, sans-serif" font-size="15">read-only by default</text>
    <text x="126" y="892" fill="#8b91a3" font-family="Arial, Helvetica, sans-serif" font-size="15">evidence before opinion</text>

    <rect x="390" y="136" width="1120" height="794" fill="#111319"/>
    <text x="434" y="192" fill="#ffac6d" font-family="Menlo, Monaco, monospace" font-size="18">---</text>
    <text x="434" y="224" fill="#8bd5ff" font-family="Menlo, Monaco, monospace" font-size="18">name:</text>
    <text x="545" y="224" fill="#e8eaf0" font-family="Menlo, Monaco, monospace" font-size="18">site-ux-audit</text>
    <text x="434" y="256" fill="#8bd5ff" font-family="Menlo, Monaco, monospace" font-size="18">description:</text>
    <text x="590" y="256" fill="#b8efc4" font-family="Menlo, Monaco, monospace" font-size="16">Test safe user flows and turn friction</text>
    <text x="590" y="284" fill="#b8efc4" font-family="Menlo, Monaco, monospace" font-size="16">into evidence-backed recommendations.</text>
    <text x="434" y="316" fill="#ffac6d" font-family="Menlo, Monaco, monospace" font-size="18">---</text>

    <text x="434" y="372" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Site UX Audit</text>
    <rect x="434" y="396" width="610" height="4" rx="2" fill="url(#accent)"/>
    <text x="434" y="446" fill="#aeb3c1" font-family="Arial, Helvetica, sans-serif" font-size="20">Inspect the experience as a careful first-time user.</text>

    <g transform="translate(434,486)">
      <rect width="490" height="154" rx="14" fill="#191d27" stroke="#343846"/>
      <circle cx="34" cy="37" r="14" fill="#ff9c61" opacity="0.18"/>
      <path d="M28 37h12M34 31v12" stroke="#ff9c61" stroke-width="3" stroke-linecap="round"/>
      <text x="66" y="43" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Test what users can reach</text>
      <text x="24" y="84" fill="#aeb3c1" font-family="Arial, Helvetica, sans-serif" font-size="17">Buttons · forms · navigation</text>
      <text x="24" y="112" fill="#aeb3c1" font-family="Arial, Helvetica, sans-serif" font-size="17">loading · empty · success · error states</text>
    </g>

    <g transform="translate(950,486)">
      <rect width="490" height="154" rx="14" fill="#191d27" stroke="#343846"/>
      <circle cx="34" cy="37" r="14" fill="#75d6a0" opacity="0.18"/>
      <path d="M26 37l6 6 11-13" fill="none" stroke="#75d6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="43" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Show the work</text>
      <text x="24" y="84" fill="#aeb3c1" font-family="Arial, Helvetica, sans-serif" font-size="17">Expected vs. actual · user impact</text>
      <text x="24" y="112" fill="#aeb3c1" font-family="Arial, Helvetica, sans-serif" font-size="17">severity · recommendation · confidence</text>
    </g>

    <rect x="434" y="682" width="1006" height="164" rx="14" fill="#241d22" stroke="#5b3c3e"/>
    <text x="462" y="726" fill="#ff9d5c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">SAFETY BOUNDARY</text>
    <text x="462" y="766" fill="#f3d5d0" font-family="Arial, Helvetica, sans-serif" font-size="20">Read-only by default. Never purchase, delete, publish, send,</text>
    <text x="462" y="800" fill="#f3d5d0" font-family="Arial, Helvetica, sans-serif" font-size="20">or submit anything without explicit approval.</text>
  </g>

  <text x="90" y="972" fill="#8b91a3" font-family="Arial, Helvetica, sans-serif" font-size="16">Codex Skills · site-ux-audit · evidence before opinion</text>
</svg>
